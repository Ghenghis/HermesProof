<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="t d">
  <title id="t">Windows 11 installation and fail-closed recovery flow</title><desc id="d">After standalone Ed25519 verification, the signed release installer verifies its manifest, stages HermesProof, probes both servers, snapshots each client in an immutable manifest, writes configurations, enables optional updates, and preserves recovery data whenever safe restore cannot be proven.</desc>
  <defs><linearGradient id="g" x2="1"><stop stop-color="#071a2b"/><stop offset="1" stop-color="#1e153b"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#55e7ff"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef9ff}.h{font-size:25px;font-weight:800}.n{font-size:16px;font-weight:700}.s{font-size:13px;fill:#b8cfde}.b{fill:#102a42;stroke:#3e789c;stroke-width:2}.p{fill:none;stroke:#55e7ff;stroke-width:3;marker-end:url(#a);stroke-dasharray:9 7;animation:f 1.6s linear infinite}@keyframes f{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs>
  <rect width="1120" height="430" rx="28" fill="url(#g)"/><text class="h" x="560" y="47" text-anchor="middle">One Windows bundle → every supported client → one safe update path</text>
  <g text-anchor="middle"><rect class="b" x="30" y="92" width="170" height="92" rx="15"/><text class="n" x="115" y="123">Verify bundle</text><text class="s" x="115" y="148">Ed25519 + SHA-256</text>
  <rect class="b" x="230" y="92" width="170" height="92" rx="15"/><text class="n" x="315" y="123">Stage release</text><text class="s" x="315" y="148">per-user, no admin</text>
  <rect class="b" x="430" y="92" width="190" height="92" rx="15"/><text class="n" x="525" y="123">Probe both MCPs</text><text class="s" x="525" y="148">121 core · 34 composite</text>
  <rect class="b" x="650" y="92" width="190" height="92" rx="15"/><text class="n" x="745" y="123">Snapshot clients</text><text class="s" x="745" y="148">hash-guarded backups</text>
  <rect class="b" x="870" y="92" width="220" height="92" rx="15"/><text class="n" x="980" y="123">Wire stable launcher</text><text class="s" x="980" y="148">configs never point at a SHA</text></g>
  <path class="p" d="M200 138h30 M400 138h30 M620 138h30 M840 138h30"/>
  <rect class="b" x="55" y="247" width="1010" height="132" rx="18"/><text class="n" x="560" y="278" text-anchor="middle">Supported defaults and recovery boundary</text><text class="s" x="560" y="307" text-anchor="middle">Kilo Code · VS Code · Codex · Windsurf · LM Studio · Claude Desktop/Code · Cursor · Devin template</text><text class="s" x="560" y="334" text-anchor="middle">LM Studio LM Link preferred · Ollama fallback · immutable client backup · idempotent uninstall</text><text class="s" x="560" y="357" text-anchor="middle">Restore drift or missing helper → nonzero exit → purge blocked → managed recovery data preserved</text>
  <path class="p" d="M980 184v39H560v34"/>
</svg>
