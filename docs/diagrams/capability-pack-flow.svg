<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="t d">
  <title id="t">Current capability pack flow</title><desc id="d">HermesProof resolves local catalog requirements into minimal pinned capabilities, validates npm integrity and runtime identity, grants scoped leases, then disables idle servers.</desc>
  <defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#08192b"/><stop offset="1" stop-color="#24123b"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#62eaff"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eefaff}.h{font-size:25px;font-weight:800}.n{font-size:16px;font-weight:700}.s{font-size:13px;fill:#bfd0df}.b{fill:#102941;stroke:#3f7aa0;stroke-width:2}.p{fill:none;stroke:#62eaff;stroke-width:3;marker-end:url(#a);stroke-dasharray:8 7;animation:f 1.5s linear infinite}@keyframes f{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs>
  <rect width="1100" height="430" rx="26" fill="url(#g)"/><text class="h" x="550" y="45" text-anchor="middle">Capability packs: everything available, nothing unnecessarily exposed</text>
  <g text-anchor="middle"><rect class="b" x="35" y="90" width="180" height="90" rx="15"/><text class="n" x="125" y="122">Outcome request</text><text class="s" x="125" y="148">acceptance graph</text>
  <rect class="b" x="260" y="90" width="180" height="90" rx="15"/><text class="n" x="350" y="122">Gap resolver</text><text class="s" x="350" y="148">installed vs required</text>
  <rect class="b" x="485" y="73" width="190" height="124" rx="15"/><text class="n" x="580" y="107">Verify npm pack</text><text class="s" x="580" y="132">SRI · package lock</text><text class="s" x="580" y="154">executable · SBOM</text><text class="s" x="580" y="176">health probe · disabled</text>
  <rect class="b" x="720" y="90" width="155" height="90" rx="15"/><text class="n" x="797" y="122">Scoped lease</text><text class="s" x="797" y="148">task + time + paths</text>
  <rect class="b" x="920" y="90" width="145" height="90" rx="15"/><text class="n" x="992" y="122">Invoke</text><text class="s" x="992" y="148">minimal tool chain</text></g>
  <path class="p" d="M215 135h45 M440 135h45 M675 135h45 M875 135h45"/>
  <g><rect class="b" x="90" y="255" width="920" height="110" rx="18"/><text class="n" x="550" y="286" text-anchor="middle">v0.9.2 catalog boundary</text><text class="s" x="550" y="317" text-anchor="middle">Kilo backend npm pack (apply) · reverse-engineering inventory (plan only)</text><text class="s" x="550" y="342" text-anchor="middle">publisher signatures · registry discovery · OS sandbox · multi-format adapters = reviewed roadmap</text></g>
  <path class="p" d="M992 180v40H550v35"/>
</svg>
