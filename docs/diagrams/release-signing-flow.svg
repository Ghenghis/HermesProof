<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="release-signing-title release-signing-desc">
  <title id="release-signing-title">HermesProof offline Ed25519 release signing and verification</title>
  <desc id="release-signing-desc">Tracked source becomes a manifest-bound Windows ZIP. A private Ed25519 key outside the repository signs its filename, digest, schema, and public-key fingerprint. GitLab publishes the ZIP, checksum, signature, public key, and standalone verifier. Installation starts only when every check passes; any mismatch stops the flow.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061827"/><stop offset=".55" stop-color="#121b3c"/><stop offset="1" stop-color="#281340"/></linearGradient>
    <linearGradient id="node" x2="1"><stop stop-color="#0d324d"/><stop offset="1" stop-color="#22275b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55e7ff"/></marker>
    <marker id="stop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#ff6388"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef9ff}.h{font-size:28px;font-weight:800}.n{font-size:16px;font-weight:750}.s{font-size:13px;fill:#b7d4e6}.tiny{font-size:12px;fill:#9fc5da}.box{fill:url(#node);stroke:#3d81a7;stroke-width:2}.key{fill:#2c2146;stroke:#b486ff;stroke-width:2}.pass{fill:#103d3c;stroke:#45e1ac;stroke-width:2}.fail{fill:#451d35;stroke:#ff6388;stroke-width:2}.flow{fill:none;stroke:#55e7ff;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow);animation:flow 1.5s linear infinite}.trust{fill:none;stroke:#b486ff;stroke-width:2.5;stroke-dasharray:6 7;marker-end:url(#arrow);animation:flow 1.9s linear infinite}.reject{fill:none;stroke:#ff6388;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#stop);animation:reject 1.4s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes reject{to{stroke-dashoffset:30}}@keyframes pulse{50%{filter:url(#glow);opacity:.82}}@media(prefers-reduced-motion:reduce){.flow,.trust,.reject,.pulse{animation:none}}</style>
  </defs>
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <text class="h" x="600" y="48" text-anchor="middle">Source to signed ZIP to verified install</text>
  <text class="s" x="600" y="73" text-anchor="middle">Offline, fail-closed, mirrored on GitLab + GitHub, independently verifiable before extraction</text>
  <g text-anchor="middle">
    <rect class="box" x="28" y="120" width="170" height="104" rx="16"/><text class="n" x="113" y="153">Tracked source</text><text class="s" x="113" y="179">clean HEAD</text><text class="s" x="113" y="199">121 + 34 tools</text>
    <rect class="box" x="230" y="120" width="178" height="104" rx="16"/><text class="n" x="319" y="153">Build manifest</text><text class="s" x="319" y="179">file SHA-256</text><text class="s" x="319" y="199">source commit</text>
    <rect class="box pulse" x="440" y="120" width="190" height="104" rx="16"/><text class="n" x="535" y="153">Sign archive</text><text class="s" x="535" y="179">Ed25519 + SHA-256</text><text class="s" x="535" y="199">self-verification</text>
    <rect class="box" x="662" y="103" width="220" height="138" rx="16"/><text class="n" x="772" y="137">GitLab release assets</text><text class="s" x="772" y="162">ZIP + .sha256 + .sig</text><text class="s" x="772" y="183">public PEM + verifier</text><text class="s" x="772" y="204">manifest + SBOM + proof</text>
    <rect class="pass pulse" x="914" y="120" width="255" height="104" rx="16"/><text class="n" x="1042" y="153">Verify before extraction</text><text class="s" x="1042" y="179">digest + name + schema</text><text class="s" x="1042" y="199">fingerprint + signature</text>
  </g>
  <path class="flow" d="M198 172h32 M408 172h32 M630 172h32 M882 172h32"/>
  <g text-anchor="middle">
    <rect class="key" x="345" y="305" width="205" height="92" rx="16"/><text class="n" x="448" y="337">Private release key</text><text class="s" x="448" y="362">C:\private, user-only ACL</text><text class="tiny" x="448" y="381">never Git, ZIP, logs, or proof</text>
    <rect class="key" x="620" y="305" width="205" height="92" rx="16"/><text class="n" x="723" y="337">Pinned public key</text><text class="s" x="723" y="362">reviewed in source</text><text class="tiny" x="723" y="381">fingerprint in release notes</text>
    <rect class="pass" x="914" y="306" width="255" height="91" rx="16"/><text class="n" x="1042" y="339">Install both MCP servers</text><text class="s" x="1042" y="364">manifest then live handshakes</text><text class="tiny" x="1042" y="383">known-good rollback preserved</text>
  </g>
  <path class="trust" d="M448 305V254h87v-30"/><path class="trust" d="M723 305v-44h319v-37"/><path class="flow" d="M1042 224v82"/>
  <rect class="fail" x="255" y="456" width="690" height="70" rx="17"/><text class="n" x="600" y="485" text-anchor="middle">Any missing asset, malformed checksum, renamed ZIP, wrong key, or invalid signature</text><text class="s" x="600" y="507" text-anchor="middle">nonzero exit - do not extract or install - preserve the previous known-good release</text>
  <path class="reject" d="M1042 224v267H945"/>
</svg>
