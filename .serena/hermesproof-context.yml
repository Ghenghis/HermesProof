description: HermesProof single-project semantic context with exact MCP exposure
prompt: |
  Serena is the semantic analysis engine inside the hp-mha-serena composite server.
  Work only in the project supplied at startup. Treat HermesProof workspace bindings,
  task claims, exact-file locks, evidence, tests, and release gates as authoritative.
  Do not mutate files, memories, projects, processes, or language-server state.
excluded_tools:
- activate_project
- create_text_file
- delete_memory
- edit_memory
- execute_shell_command
- insert_after_symbol
- insert_before_symbol
- onboarding
- rename_memory
- rename_symbol
- replace_content
- replace_in_files
- replace_symbol_body
- safe_delete_symbol
- write_memory
included_optional_tools:
- get_diagnostics_for_symbol
tool_description_overrides: {}
single_project: false
structured_tool_output: true
