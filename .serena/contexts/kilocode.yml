description: Kilo Code context with Serena semantic intelligence and HermesProof-governed mutations
prompt: |
  You are running inside Kilo Code. Use Serena for symbol-aware retrieval, references,
  implementations, diagnostics, and refactoring analysis. Kilo Code owns its basic filesystem and
  terminal tools. In HermesProof projects, route mutations through hp-mha-serena after a task claim
  and exact file lock, then record diagnostics, tests, and release evidence.
excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
included_optional_tools:
  - get_diagnostics_for_symbol
tool_description_overrides: {}
single_project: true
