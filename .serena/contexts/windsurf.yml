description: Windsurf context with Serena semantic intelligence and Windsurf-owned basic file and shell operations
prompt: |
  You are running inside Windsurf. Prefer Serena's symbol overview, declaration, implementation,
  reference, rename, and diagnostic capabilities over whole-file scanning. Windsurf owns basic
  file reads, line edits, and shell operations. In HermesProof projects, all mutation requires a
  task claim, exact file lock, diagnostics, tests, and evidence.
excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
included_optional_tools:
  - get_diagnostics_for_symbol
tool_description_overrides: {}
single_project: true
